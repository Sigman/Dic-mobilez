<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>DIC Mobile</title>
<style>
body { margin:0; background:black; text-align:center; color:white; }
canvas { width:100%; max-width:600px; }
video { display:none; }
button { padding:12px; margin:10px; }
</style>
</head>

<body>

<h3>DIC Camera Live</h3>
<button onclick="start()">START</button>

<video id="v" autoplay playsinline></video>
<canvas id="c"></canvas>

<script>
const v = document.getElementById("v");
const c = document.getElementById("c");
const ctx = c.getContext("2d");

let ref = null;
const W = 160, H = 120;

async function start(){
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: W, height: H }
  });

  v.srcObject = stream;

  v.onloadeddata = () => {
    c.width = W;
    c.height = H;
    captureRef();
    loop();
  };
}

function captureRef(){
  ctx.drawImage(v,0,0,W,H);
  ref = ctx.getImageData(0,0,W,H);
}

function lum(d,i){
  return (d[i]+d[i+1]+d[i+2])/3;
}

function loop(){
  requestAnimationFrame(loop);
  if(!ref || v.readyState<2) return;

  ctx.drawImage(v,0,0,W,H);
  const f = ctx.getImageData(0,0,W,H);

  const out = ctx.createImageData(W,H);

  for(let i=0;i<f.data.length;i+=4){

    const diff =
      Math.abs(f.data[i]-ref.data[i]) +
      Math.abs(f.data[i+1]-ref.data[i+1]) +
      Math.abs(f.data[i+2]-ref.data[i+2]);

    const v = Math.min(255,diff*2);

    out.data[i]=v;
    out.data[i+1]=255-v;
    out.data[i+2]=80;
    out.data[i+3]=200;
  }

  ctx.putImageData(out,0,0);
}
</script>

</body>
</html>
